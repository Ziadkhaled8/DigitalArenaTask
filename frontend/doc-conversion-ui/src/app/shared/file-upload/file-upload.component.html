<div
  class="dropzone"
  [class.dragover]="isDragOver"
  [class.has-file]="!!selectedFile"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
  (click)="fileInput.click()"
>
  <input
    #fileInput
    type="file"
    accept=".pdf,application/pdf"
    class="hidden-input"
    (change)="onFileChange($event)"
  />

  @if (!selectedFile) {
    <div class="empty-state">
      <div class="upload-icon-wrapper">
        <svg class="upload-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.75"
            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
          />
        </svg>
      </div>
      <div class="prompt-text">
        <span class="highlight">Click to upload</span> or drag & drop PDF
      </div>
      <p class="sub-text">Accepts PDF files up to 100 MB</p>
    </div>
  } @else {
    <div class="file-info" (click)="$event.stopPropagation()">
      <div class="file-icon-wrapper">
        <svg class="file-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.75"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
          />
        </svg>
      </div>
      <div class="file-details">
        <span class="file-name" [title]="selectedFile.name">{{ selectedFile.name }}</span>
        <span class="file-size">{{ formatSize(selectedFile.size) }}</span>
      </div>
      <button
        type="button"
        class="remove-btn"
        (click)="removeFile($event)"
        title="Remove file"
      >
        <svg class="close-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>
  }
</div>
